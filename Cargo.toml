[package]
name = "kabaper"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "kabaper"
path = "src/main.rs"

[lib]
name = "kabaper"
path = "src/lib.rs"


[dependencies]
rand = "0.10.3"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Imaging",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Ole",
    "Win32_Security",
    "Win32_System_TaskScheduler",
    "Win32_Devices_Display",
    "Win32_Storage_FileSystem",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_IO",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
] }

[profile.dev]
opt-level = 0
debug = 1
split-debuginfo = "unpacked"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[build-dependencies]
winres = "0.1"


